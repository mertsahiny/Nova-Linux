name: NOVA Linux Validation

on:
  workflow_dispatch:
  push:
    branches: [ main, "fix/live-boot-init", "fix/calamares-branding" ]
  pull_request:

permissions:
  contents: read

jobs:
  validate-nova:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required project files
        run: |
          set -Eeuo pipefail
          required=(
            README.md VERSION LICENSE TODO.md
            "Nova Wallpaper.png" NOVA_vibes.desktop
            build/build-all.sh
            tests/test-packages.sh tests/smoke-boot.sh
            .github/workflows/build.yml
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file" >&2; exit 1; }
          done
          echo "All required project files exist."

      - name: Validate shell syntax
        run: |
          set -Eeuo pipefail
          bash -n build/build-all.sh
          bash -n tests/test-packages.sh
          bash -n tests/smoke-boot.sh
          bash -n scripts/generate-checksums.sh
          git diff --check
          echo "Shell syntax and whitespace checks passed."

      - name: Validate boot-chain requirements
        run: |
          set -Eeuo pipefail
          grep -Fq 'live-boot-initramfs-tools' build/build-all.sh
          grep -Fq "grep -Fxq 'scripts/live'" build/build-all.sh
          grep -Fq 'sysvinit-core' build/build-all.sh
          grep -Fq 'rc-update add udev sysinit' build/build-all.sh
          grep -Fq 'NOVA_BOOT_COMPLETED' build/build-all.sh
          grep -Fq 'NOVA_NETWORK_MANAGER_RUNNING' build/build-all.sh
          grep -Fq 'NOVA_NETWORK_CONNECTED' build/build-all.sh
          grep -Fq 'orphan-sysvinit-scripts' build/build-all.sh
          grep -Fq 'nova-installer-launcher' build/build-all.sh
          grep -Fq 'componentName: debian' build/build-all.sh
          grep -Fq 'componentName: debian' tests/test-packages.sh
          grep -Fq 'PRETTY_NAME="Nova Linux 0.1.0"' build/build-all.sh
          grep -Fq 'ID=nova' build/build-all.sh
          grep -Fq 'Calamares loaded the NOVA-branded configuration' build/build-all.sh
          grep -Fq 'Exec=/usr/bin/konsole --hold -e /usr/local/bin/nova-installer-launcher' build/build-all.sh
          grep -Fq 'PipeWire did not become ready' build/build-all.sh
          grep -Fq 'sddm-theme-breeze' build/build-all.sh
          grep -Fq 'blueman' build/build-all.sh
          grep -Fq 'powerdevil' build/build-all.sh
          grep -Fq 'brightnessctl' build/build-all.sh
          grep -Fq 'firmware-atheros' build/build-all.sh
          grep -Fq 'ideapad_laptop ath10k_pci btusb' build/build-all.sh
          grep -Fq 'rfkill unblock all' build/build-all.sh
          grep -Fq 'nova-laptop-hardware' build/build-all.sh
          grep -Fq 'nova-laptop-hardware' tests/test-packages.sh
          grep -Fq 'Smoke-test live boot in QEMU' .github/workflows/build.yml
          grep -Fq 'qemu-system-x86_64' tests/smoke-boot.sh
          echo "Boot-chain safeguards are present."
