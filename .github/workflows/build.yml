name: NOVA Linux Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  build-nova:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools \
            qemu-system-x86

      - name: Build NOVA Linux ISO
        run: |
          sudo mkdir -p out
          sudo env NOVA_VERSION="$(cat VERSION)" bash build/build-all.sh

      - name: Validate ISO structure
        run: |
          ISO="out/NOVA-Linux-$(cat VERSION)-amd64.iso"

          test -s "$ISO"
          test -s "$ISO.sha256"

          xorriso -indev "$ISO" -ls /live > out/live-files.txt

          grep -q 'filesystem.squashfs' out/live-files.txt

          xorriso -indev "$ISO" -report_el_torito plain

          sha256sum -c "$ISO.sha256"
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Linux-${{ github.sha }}
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          retention-days: 14
