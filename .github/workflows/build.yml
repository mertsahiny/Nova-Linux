
name: NOVA Linux Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      desktop:
        description: Desktop edition to build
        required: true
        type: choice
        default: kde
        options:
          - kde
          - gnome
          - xfce
          - cinnamon
          - lxqt
          - lxde
          - mate
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  build-nova:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools \
            qemu-system-x86

      - name: Build NOVA Linux ISO
# Triggered build requested by the maintainer.
        run: |
          sudo mkdir -p out
          sudo env NOVA_VERSION="$(cat VERSION)" NOVA_DESKTOP="${{ github.event.inputs.desktop || 'kde' }}" bash build/build-all.sh

      - name: Validate ISO structure
        run: |
          ISO="out/NOVA-Linux-$(cat VERSION)-amd64.iso"

          test -s "$ISO"
          test -s "$ISO.sha256"

          xorriso -indev "$ISO" -ls /live \
            > "$RUNNER_TEMP/live-files.txt"

          grep -q 'filesystem.squashfs' "$RUNNER_TEMP/live-files.txt"

          xorriso -indev "$ISO" -report_el_torito plain

          sha256sum -c "$ISO.sha256"

      - name: Boot-test the live ISO in QEMU
        run: |
          ISO="out/NOVA-Linux-$(cat VERSION)-amd64.iso"
          LOG="$RUNNER_TEMP/nova-qemu-boot.log"

          # Give the live kernel and PID 1 a serial console so the CI runner
          # can verify that the system reaches userspace, not just that the
          # ISO contains files with the expected names.
          set +e
          timeout 180s qemu-system-x86_64 \
            -machine accel=tcg \
            -m 4096 \
            -smp 2 \
            -display none \
            -serial stdio \
            -monitor none \
            -no-reboot \
            -no-shutdown \
            -boot d \
            -cdrom "$ISO" \
            > "$LOG" 2>&1
          QEMU_STATUS=$?
          set -e

          cat "$LOG"

          # Strip ANSI/terminal control sequences before checking systemd
          # messages; otherwise colour codes split words such as "Reached".
          CLEAN_LOG="$RUNNER_TEMP/nova-qemu-boot-clean.log"
          sed -E 's/\x1B\[[0-9;?]*[ -/]*[@-~]//g' "$LOG" > "$CLEAN_LOG"

          if grep -qiE 'Kernel panic|Attempted to kill init' "$CLEAN_LOG"; then
            echo "ERROR: NOVA live boot panicked in QEMU." >&2
            exit 1
          fi

          if ! grep -qiE 'openrc-init|OpenRC|starting default runlevel' "$CLEAN_LOG"; then
            echo "ERROR: QEMU did not confirm that NOVA started OpenRC (QEMU exit: $QEMU_STATUS)." >&2
            exit 1
          fi

          echo "SUCCESS: NOVA booted through the OpenRC init path."

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Linux-${{ github.sha }}
          path: |
            out/*.iso
            out/*.sha256
          if-no-files-found: error
          retention-days: 14